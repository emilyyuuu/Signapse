[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sign-recognition"
version = "0.1.0"
description = "Signapse sign recognition: hand landmarks to isolated sign labels (DTW + k-NN), on device."
requires-python = ">=3.10,<3.13"
dependencies = [
    "mediapipe>=0.10.14",
    "opencv-python>=4.9",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
explore = ["pandas", "pyarrow"]

# This folder is the package itself: apps/sign_recognition/ -> import sign_recognition.
[tool.setuptools]
package-dir = { "sign_recognition" = "." }
packages = ["sign_recognition"]

[tool.pytest.ini_options]
testpaths = ["tests"]
